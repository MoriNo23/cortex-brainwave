name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ligero:
    name: Nivel ligero (sin navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Sin `npm install` y sin `playwright install`: el nivel ligero corre solo con Node.
      - name: Nivel ligero de verificación
        run: node tests/light/run-light-verify.cjs

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: light-verify
          path: artifacts/light-verify.json
          if-no-files-found: warn

  astro-y-math:
    name: Shell Astro + referencia matemática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias Node
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Servir preview Astro en el puerto 4173
        run: |
          nohup npm run preview > /tmp/cortex-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null && curl -sf http://127.0.0.1:4173/cortex.html > /dev/null; then
              echo "preview listo"
              exit 0
            fi
            sleep 0.5
          done
          echo "el preview no respondió"
          cat /tmp/cortex-preview.log
          exit 1

      - name: Smoke del shell Astro
        if: always()
        run: node tests/astro-shell-smoke.cjs

      - name: Instalar dependencias Python
        if: always()
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-math.txt

      - name: Generar referencia Python
        if: always()
        run: |
          mkdir -p artifacts
          python3 tools/math-reference/reference.py > artifacts/math-reference-python.json

      - name: Generar referencia JS
        if: always()
        run: node tools/math-reference/compare.mjs > artifacts/math-reference-js.json

      - name: Comparar JS vs Python
        if: always()
        run: node tools/math-reference/compare.mjs artifacts/math-reference-python.json > artifacts/math-reference-compare.json

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: astro-shell-y-math
          path: artifacts/
          if-no-files-found: warn

  suite:
    name: Suite completa (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Servir preview Astro en el puerto 4173
        run: |
          nohup npm run preview > /tmp/cortex-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null && curl -sf http://127.0.0.1:4173/cortex.html > /dev/null; then
              echo "preview listo"
              exit 0
            fi
            sleep 0.5
          done
          echo "el preview no respondió"
          cat /tmp/cortex-preview.log
          exit 1

      - name: Smoke del shell Astro
        if: always()
        run: node tests/astro-shell-smoke.cjs

      - name: Suite in-page (spec de OpenSpec)
        if: always()
        run: node tests/run-cortex-tests.cjs

      - name: Estabilidad de UI
        if: always()
        run: node tests/ui-stability.cjs

      - name: Programación temporal del timeline
        if: always()
        run: node tests/timeline-scheduling.cjs

      - name: Transiciones del timeline
        if: always()
        run: node tests/timeline-transitions.cjs

      - name: Timeline y presets personalizados
        if: always()
        run: node tests/timeline-custom-presets.cjs

      - name: Dock del timeline
        if: always()
        run: node tests/timeline-dock.cjs

      - name: Portadora de ruido
        if: always()
        run: node tests/noise-carrier.cjs

      - name: Exportación WAV
        if: always()
        run: node tests/wav-e2e.cjs

      - name: Smoke visual
        if: always()
        run: node tests/visual-smoke.cjs

      - name: Responsive
        if: always()
        run: node tests/responsive-smoke.cjs

      - name: Audio real (smoke)
        if: always()
        run: node tests/real-smoke.cjs

      - name: Snapshots deterministas
        if: always()
        run: node tests/snapshots.cjs

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-chromium
          path: artifacts/
          if-no-files-found: warn

  motores:
    name: Timeline y UI en ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Instalar ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Servir preview Astro en el puerto 4173
        run: |
          nohup npm run preview > /tmp/cortex-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null && curl -sf http://127.0.0.1:4173/cortex.html > /dev/null; then
              echo "preview listo"
              exit 0
            fi
            sleep 0.5
          done
          echo "el preview no respondió"
          cat /tmp/cortex-preview.log
          exit 1

      - name: Programación temporal del timeline
        if: always()
        run: node tests/timeline-scheduling.cjs
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Transiciones del timeline
        if: always()
        run: node tests/timeline-transitions.cjs
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Estabilidad de UI
        if: always()
        run: node tests/ui-stability.cjs
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Timeline y presets personalizados
        if: always()
        run: node tests/timeline-custom-presets.cjs
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Dock del timeline
        if: always()
        run: node tests/timeline-dock.cjs
        env:
          ENGINE: ${{ matrix.engine }}

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ matrix.engine }}
          path: artifacts/
          if-no-files-found: warn

  matriz:
    name: Matriz de navegadores (Chromium/Firefox/WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      - name: Instalar los tres motores
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Servir preview Astro en el puerto 4173
        run: |
          nohup npm run preview > /tmp/cortex-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null && curl -sf http://127.0.0.1:4173/cortex.html > /dev/null; then
              echo "preview listo"
              exit 0
            fi
            sleep 0.5
          done
          echo "el preview no respondió"
          cat /tmp/cortex-preview.log
          exit 1

      - name: Matriz de navegadores
        run: node tests/browser-matrix.cjs

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-matriz
          path: artifacts/browser-matrix.json
          if-no-files-found: warn
