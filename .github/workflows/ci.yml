name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ligero:
    name: Nivel ligero (estáticos + unitarios, sin navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Sin `npm install` y sin navegador: el nivel ligero corre solo con Node.
      - name: Chequeos estáticos (dom-references)
        run: node tests/light/run-light-verify.cjs

      # Node puro: el fuente real del Worker de la ventana flotante contra un
      # `self` y un lienzo simulados.
      - name: Worker del estrobo (unitario)
        run: node tests/strobe-worker.cjs

      # Node puro: volumen y portadora frente al timeline y al stop suave,
      # con el fuente real de src/lib y un motor de audio simulado.
      - name: Integridad de mix y carrier (unitario)
        run: node tests/mix-integrity.cjs

      - name: Lógica del timeline (unitario)
        run: node tests/timeline-logic.cjs

      - name: Exportación WAV (unitario)
        run: node tests/wav-export.cjs

      - name: Portadora de ruido (unitario)
        run: node tests/noise-carrier.cjs

      - name: Ventana flotante del estrobo (unitario)
        run: node tests/strobe-window.cjs

      - name: Atajos de teclado con guardas de foco (unitario)
        run: node tests/keyboard-shortcuts.cjs

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: light-verify
          path: artifacts/light-verify.json
          if-no-files-found: warn

  build-y-math:
    name: Build de Astro + referencia matemática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias Node
        run: npm install --no-audit --no-fund

      - name: Build Astro
        run: npm run build

      # Estático sobre el build: el HTML generado referencia JS/CSS existentes.
      # Sustituye al smoke de navegador del shell (chequeo de rutas, no de render).
      - name: Chequeo estático del build (dist-references)
        run: node tests/light/checks/dist-references.cjs

      # Con dependencias instaladas, el Worker del estrobo repite la
      # comparación sobre el fuente minificado con esbuild.
      - name: Worker del estrobo (variante minificada)
        run: node tests/strobe-worker.cjs

      - name: Instalar dependencias Python
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-math.txt

      - name: Generar referencia Python
        run: |
          mkdir -p artifacts
          python3 tools/math-reference/reference.py > artifacts/math-reference-python.json

      - name: Generar referencia JS
        run: node tools/math-reference/compare.mjs > artifacts/math-reference-js.json

      - name: Comparar JS vs Python
        run: node tools/math-reference/compare.mjs artifacts/math-reference-python.json > artifacts/math-reference-compare.json

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-y-math
          path: artifacts/
          if-no-files-found: warn
