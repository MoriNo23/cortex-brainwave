<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cortex — Test Suite</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0D0C0A; color:#F0EBE0;
    font-family: 'IBM Plex Mono', 'SF Mono', monospace;
    font-size: 12px; padding: 20px; line-height: 1.5;
  }
  h1 { font-size: 16px; margin-bottom: 4px; color:#E8A855; letter-spacing: 0.05em; }
  .sub { color:#6B6358; font-size: 11px; margin-bottom: 20px; }
  .controls {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid #2A2620;
  }
  button {
    background: #E8A855; color:#0D0C0A; border: none;
    padding: 8px 16px; border-radius: 4px;
    font-family: inherit; font-size: 11px;
    font-weight: 600; cursor: pointer; letter-spacing: 0.05em;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid #3A362E; color: #A89F8E; }
  #filePicker { display: none; }
  .status { color: #6B6358; margin-left: auto; }
  .status.ready { color: #4A9B8E; }
  .status.err { color: #C75B4A; }

  .report { max-width: 1000px; }
  .group {
    margin-bottom: 20px;
    border: 1px solid #2A2620; border-radius: 6px;
    overflow: hidden;
  }
  .group-head {
    background: #1A1814; padding: 8px 14px;
    font-size: 11px; color: #A89F8E;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: flex; justify-content: space-between;
  }
  .group-head .counts { color: #6B6358; }
  .group-head .counts .pass { color: #4A9B8E; }
  .group-head .counts .fail { color: #C75B4A; }

  .test {
    padding: 6px 14px 6px 30px;
    border-top: 1px solid #1A1814;
    font-size: 11.5px;
    position: relative;
  }
  .test::before {
    content: '○';
    position: absolute; left: 12px; top: 6px;
    color: #3A362E;
  }
  .test.pass::before { content: '✓'; color: #4A9B8E; }
  .test.fail::before { content: '✗'; color: #C75B4A; }
  .test.fail { background: rgba(199,91,74,0.05); }
  .test .spec {
    color: #6B6358; font-size: 10px;
    margin-left: 8px;
  }
  .test .msg {
    color: #C75B4A; font-size: 10.5px;
    margin-top: 3px; padding-left: 8px;
    border-left: 2px solid #C75B4A;
  }
  .summary {
    margin-top: 24px; padding: 14px;
    background: #1A1814; border-radius: 6px;
    font-size: 12px;
  }
  .summary.pass { border-left: 3px solid #4A9B8E; }
  .summary.fail { border-left: 3px solid #C75B4A; }

  #appFrame {
    position: fixed; width: 800px; height: 600px;
    left: -9999px; top: -9999px; border: 0;
  }
  .legend { color:#6B6358; font-size: 10.5px; margin-bottom: 14px; }
  .legend code { color: #A89F8E; background:#1A1814; padding: 1px 4px; border-radius: 2px; }
</style>
</head>
<body>

<h1>CORTEX · VERIFY</h1>
<div class="sub">Test suite para app de audio generativo + animación reactiva</div>

<div class="controls">
  <button id="btnRun" disabled>▶ Correr tests</button>
  <button id="btnReload" class="ghost" disabled>↻ Recargar app</button>
  <input type="file" id="filePicker" accept=".html">
  <button id="btnPick" class="ghost">📁 Cargar cortex.html</button>
  <span class="status" id="status">esperando…</span>
</div>

<div class="legend">
  Los tests marcados con <code>[spec/…]</code> mapean directo a los
  requirements del OpenSpec del radar espacial.
</div>

<div class="report" id="report"></div>

<iframe id="appFrame" sandbox="allow-scripts allow-same-origin"></iframe>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. MOCK DE APIS DEL NAVEGADOR
   Se inyecta ANTES del código de la app para interceptar todo.
   ═══════════════════════════════════════════════════════════════ */
const MOCK_CODE = `
(function() {
  const audioLog = { nodes: [], connections: [] };
  window.__AUDIO_LOG__ = audioLog;
  const drawLog = [];
  window.__DRAW_LOG__ = drawLog;

  class MockAudioParam {
    constructor(v) { this.value = v; this._history = []; }
    setValueAtTime(v) { this.value = v; this._history.push(['set', v]); }
    linearRampToValueAtTime(v) { this.value = v; this._history.push(['lin', v]); }
    exponentialRampToValueAtTime(v) { this.value = v; this._history.push(['exp', v]); }
    cancelScheduledValues() {}
    cancelAndHoldAtTime() {}
  }
  class MockNode {
    constructor(type) {
      this._type = type; this._connections = [];
      this._started = false; this._stopped = false;
      audioLog.nodes.push(this);
    }
    connect(t) { this._connections.push(t); audioLog.connections.push([this, t]); return t; }
    disconnect() {}
    start() { this._started = true; }
    stop() { this._stopped = true; }
  }
  class MockOsc extends MockNode {
    constructor() { super('oscillator'); this.type = 'sine'; this.frequency = new MockAudioParam(440); }
  }
  class MockGain extends MockNode {
    constructor() { super('gain'); this.gain = new MockAudioParam(1); }
  }
  class MockPanner extends MockNode {
    constructor() { super('panner'); this.pan = new MockAudioParam(0); }
  }
  class MockBufferSource extends MockNode {
    constructor() { super('bufferSource'); this.buffer = null; this.loop = false; }
  }
  class MockFilter extends MockNode {
    constructor() {
      super('biquadFilter');
      this.type = 'lowpass';
      this.frequency = new MockAudioParam(350);
      this.Q = new MockAudioParam(1);
    }
  }
  class MockCtx {
    constructor() {
      this.currentTime = 0; this.sampleRate = 44100; this.state = 'running';
      this.destination = new MockNode('destination');
    }
    createOscillator() { return new MockOsc(); }
    createGain() { return new MockGain(); }
    createStereoPanner() { return new MockPanner(); }
    createBiquadFilter() { return new MockFilter(); }
    createBufferSource() { return new MockBufferSource(); }
    createBuffer(ch, len, sr) {
      const data = new Float32Array(len);
      return { numberOfChannels: ch, length: len, sampleRate: sr, getChannelData: () => data };
    }
    resume() { return Promise.resolve(); }
    suspend() { return Promise.resolve(); }
  }
  class MockOfflineCtx extends MockCtx {
    constructor(ch, len, sr) { super(); this._len = len; }
    startRendering() {
      const len = this._len;
      return Promise.resolve({
        numberOfChannels: 2, length: len, sampleRate: this.sampleRate,
        getChannelData: () => new Float32Array(len)
      });
    }
  }
  window.AudioContext = MockCtx;
  window.webkitAudioContext = MockCtx;
  window.OfflineAudioContext = MockOfflineCtx;

  const ctxCache = new WeakMap();
  const origGet = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function(type) {
    if (type !== '2d') return origGet.apply(this, arguments);
    if (ctxCache.has(this)) return ctxCache.get(this);
    const calls = [];
    const ctx = {
      canvas: this, _calls: calls,
      fillStyle: '#000', strokeStyle: '#000', lineWidth: 1, globalAlpha: 1,
      font: '', textAlign: 'left', textBaseline: 'alphabetic',
      clearRect() { calls.push(['clearRect', ...arguments]); },
      beginPath() { calls.push(['beginPath']); },
      closePath() { calls.push(['closePath']); },
      moveTo() { calls.push(['moveTo', ...arguments]); },
      lineTo() { calls.push(['lineTo', ...arguments]); },
      arc() { calls.push(['arc', ...arguments]); },
      ellipse() { calls.push(['ellipse', ...arguments]); },
      rect() { calls.push(['rect', ...arguments]); },
      fill() { calls.push(['fill', this.fillStyle]); },
      stroke() { calls.push(['stroke', this.strokeStyle]); },
      fillText() { calls.push(['fillText', ...arguments]); },
      save() {}, restore() {}, translate() {}, rotate() {}, scale() {},
      setTransform() {}, measureText: () => ({ width: 0 }),
      createRadialGradient() { return { addColorStop: () => {} }; },
      createLinearGradient() { return { addColorStop: () => {} }; }
    };
    ctxCache.set(this, ctx);
    drawLog.push(ctx);
    return ctx;
  };
})();
`;

/* ═══════════════════════════════════════════════════════════════
   2. CARGA DE LA APP
   ═══════════════════════════════════════════════════════════════ */
let frameWin = null, frameDoc = null, appReady = false;

async function loadApp() {
  const frame = document.getElementById('appFrame');
  const status = document.getElementById('status');
  status.textContent = 'cargando…';
  status.className = 'status';

  let html = null;
  try {
    const r = await fetch('cortex.html');
    if (r.ok) html = await r.text();
  } catch (e) { /* file:// bloquea fetch */ }

  if (!html) {
    status.textContent = 'no se pudo hacer fetch — usá "Cargar cortex.html"';
    status.className = 'status err';
    document.getElementById('btnPick').style.display = '';
    return;
  }

  await injectApp(frame, html);
  onAppLoaded();
}

async function injectApp(frame, html) {
  const mocked = html.replace('<head>', '<head><script>' + MOCK_CODE + '<\/script>');
  await new Promise(res => {
    frame.addEventListener('load', res, { once: true });
    frame.srcdoc = mocked;
  });
}

function onAppLoaded() {
  const frame = document.getElementById('appFrame');
  frameWin = frame.contentWindow;
  frameDoc = frame.contentDocument;

  if (!frameWin.__CORTEX__) {
    document.getElementById('status').textContent = 'la app no exportó __CORTEX__ (¿aplicaste el patch?)';
    document.getElementById('status').className = 'status err';
    return;
  }

  appReady = true;
  document.getElementById('status').textContent = 'app lista';
  document.getElementById('status').className = 'status ready';
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnReload').disabled = false;
}

document.getElementById('btnPick').addEventListener('click', () => {
  document.getElementById('filePicker').click();
});
document.getElementById('filePicker').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const html = await file.text();
  const frame = document.getElementById('appFrame');
  await injectApp(frame, html);
  onAppLoaded();
});
document.getElementById('btnReload').addEventListener('click', loadApp);
document.getElementById('btnRun').addEventListener('click', runAllTests);

/* ═══════════════════════════════════════════════════════════════
   3. HELPERS
   ═══════════════════════════════════════════════════════════════ */
const $  = (s) => frameDoc.querySelector(s);
const $$ = (s) => Array.from(frameDoc.querySelectorAll(s));
const C  = () => frameWin.__CORTEX__;
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function radarCtx() {
  return frameWin.__DRAW_LOG__.find(c => c.canvas.id === 'radarCanvas');
}
function waveCtx() {
  return frameWin.__DRAW_LOG__.find(c => c.canvas.id === 'waveCanvas');
}
function resetDrawLog() {
  frameWin.__DRAW_LOG__.forEach(c => c._calls.length = 0);
}
function callsOf(ctx, method) {
  return ctx._calls.filter(c => c[0] === method);
}
function setMods({ stereo=0, fmod=0, binaural=0, amod=0, noise=0, mix=80, brainwave=10, carrier=200, playing=false } = {}) {
  const s = C().state;
  s.stereo = stereo; s.fmod = fmod; s.binaural = binaural;
  s.amod = amod; s.noise = noise; s.mix = mix;
  s.brainwave = brainwave; s.carrier = carrier;
  s.playing = playing;
}
function approx(a, b, tol = 0.001) { return Math.abs(a - b) <= tol; }
/* La UI de la app coalesce su trabajo de DOM en una pasada por frame
   (spec `ui-stability`), así que los casos que leen el DOM tras simular input
   deben esperar ese frame. */
const nextFrame = () => new Promise(r => frameWin.requestAnimationFrame(() => r()));

/* ═══════════════════════════════════════════════════════════════
   4. DEFINICIÓN DE TESTS
   ═══════════════════════════════════════════════════════════════ */
const TESTS = [

/* ── ESTADO INICIAL ── */
{ group: 'Estado inicial', name: 'state.brainwave = 10 por defecto', fn: () => {
  if (C().state.brainwave !== 10) throw new Error('esperado 10, obtenido ' + C().state.brainwave);
}},
{ group: 'Estado inicial', name: 'state.carrier = 200 por defecto', fn: () => {
  if (C().state.carrier !== 200) throw new Error('esperado 200, obtenido ' + C().state.carrier);
}},
{ group: 'Estado inicial', name: 'state.playing = false al arrancar', fn: () => {
  if (C().state.playing !== false) throw new Error('esperado false');
}},

/* ── LÓGICA DE BANDAS ── */
{ group: 'Lógica de bandas', name: 'bandFromFreq(0.5) = delta', fn: () => {
  if (C().bandFromFreq(0.5) !== 'delta') throw new Error('fallo en 0.5');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(3.99) = delta', fn: () => {
  if (C().bandFromFreq(3.99) !== 'delta') throw new Error('fallo en 3.99');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(4) = theta', fn: () => {
  if (C().bandFromFreq(4) !== 'theta') throw new Error('fallo en 4');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(7.99) = theta', fn: () => {
  if (C().bandFromFreq(7.99) !== 'theta') throw new Error('fallo en 7.99');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(8) = alpha', fn: () => {
  if (C().bandFromFreq(8) !== 'alpha') throw new Error('fallo en 8');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(12.99) = alpha', fn: () => {
  if (C().bandFromFreq(12.99) !== 'alpha') throw new Error('fallo en 12.99');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(13) = beta', fn: () => {
  if (C().bandFromFreq(13) !== 'beta') throw new Error('fallo en 13');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(29.99) = beta', fn: () => {
  if (C().bandFromFreq(29.99) !== 'beta') throw new Error('fallo en 29.99');
}},
{ group: 'Lógica de bandas', name: 'bandFromFreq(30) = gamma', fn: () => {
  if (C().bandFromFreq(30) !== 'gamma') throw new Error('fallo en 30');
}},

/* ── MOTOR DE AUDIO — CREACIÓN ── */
{ group: 'Motor de audio', name: 'AudioContext se crea al iniciar', fn: () => {
  C().engine.init();
  if (!C().engine.ctx) throw new Error('ctx no creado');
}},
{ group: 'Motor de audio', name: 'Se crean ≥7 osciladores (carrier + binaural L/R + stereo + 3 LFOs)', fn: () => {
  const oscs = frameWin.__AUDIO_LOG__.nodes.filter(n => n._type === 'oscillator');
  if (oscs.length < 7) throw new Error('solo ' + oscs.length + ' osciladores');
}},
{ group: 'Motor de audio', name: 'Binaural R arranca en carrier + brainwave', fn: () => {
  const e = C().engine;
  setMods({ brainwave: 10, carrier: 200 });
  e.updateBrainwave(10);
  e.updateCarrier(200);
  if (!approx(e.nodes.binOscR.frequency.value, 210, 0.5))
    throw new Error('esperado 210, obtenido ' + e.nodes.binOscR.frequency.value);
}},
{ group: 'Motor de audio', name: 'Todas las fuentes tienen .start() tras play', fn: () => {
  setMods(); C().engine.start();
  const srcs = ['carrierOsc','amLfo','binOscL','binOscR','stereoOsc','stereoLfo','fmLfo','noiseSourceL','noiseSourceR'];
  const missing = srcs.filter(k => !C().engine.nodes[k]._started);
  if (missing.length) throw new Error('sin start: ' + missing.join(', '));
}},
{ group: 'Motor de audio', name: 'Todas las fuentes tienen .stop() tras stop', fn: () => {
  C().engine.stop();
  const srcs = ['carrierOsc','amLfo','binOscL','binOscR','stereoOsc','stereoLfo','fmLfo','noiseSourceL','noiseSourceR'];
  const missing = srcs.filter(k => !C().engine.nodes[k]._stopped);
  if (missing.length) throw new Error('sin stop: ' + missing.join(', '));
  setMods(); C().engine.start(); // dejar corriendo
}},
{ group: 'Motor de audio', name: 'start → stop → start reconstruye fuentes', spec: 'audio/restart', fn: () => {
  const e = C().engine;
  if (!e.started) e.start();
  const first = e.nodes.carrierOsc;
  e.stop();
  if (!first._stopped) throw new Error('la primera fuente no quedó detenida');
  e.start();
  const second = e.nodes.carrierOsc;
  if (first === second) throw new Error('se reutilizó un OscillatorNode detenido');
  if (!e.started) throw new Error('la segunda sesión no inició');
}},

/* ── MOTOR DE AUDIO — PARÁMETROS ── */
{ group: 'Motor de audio · params', name: 'updateCarrier(400) → carrierOsc.frequency ≈ 400', fn: () => {
  C().engine.updateCarrier(400);
  const f = C().engine.nodes.carrierOsc.frequency.value;
  if (!approx(f, 400, 1)) throw new Error('obtenido ' + f);
}},
{ group: 'Motor de audio · params', name: 'updateBrainwave(7) → amLfo.frequency ≈ 7', fn: () => {
  C().engine.updateBrainwave(7);
  const f = C().engine.nodes.amLfo.frequency.value;
  if (!approx(f, 7, 0.1)) throw new Error('obtenido ' + f);
}},
{ group: 'Motor de audio · params', name: 'stereo=80 → stereoGain.gain ≈ 0.4', fn: () => {
  setMods({ stereo: 80 });
  C().engine.updateModLevels();
  const g = C().engine.nodes.stereoGain.gain.value;
  if (!approx(g, 0.4, 0.01)) throw new Error('esperado 0.4, obtenido ' + g);
}},
{ group: 'Motor de audio · params', name: 'binaural=50 → binGain L y R ≈ 0.25', fn: () => {
  setMods({ binaural: 50 });
  C().engine.updateModLevels();
  const gl = C().engine.nodes.binGainL.gain.value;
  const gr = C().engine.nodes.binGainR.gain.value;
  if (!approx(gl, 0.25, 0.01) || !approx(gr, 0.25, 0.01))
    throw new Error('L=' + gl + ' R=' + gr);
}},
{ group: 'Motor de audio · params', name: 'fmod=60 → fmLfoDepth.gain ≈ 12', fn: () => {
  setMods({ fmod: 60 });
  C().engine.updateModLevels();
  const g = C().engine.nodes.fmLfoDepth.gain.value;
  if (!approx(g, 12, 0.1)) throw new Error('esperado 12, obtenido ' + g);
}},
{ group: 'Motor de audio · params', name: 'noise=40 → crossfade carrier/noise ≈ 0.1', fn: () => {
  setMods({ noise: 40 });
  C().engine.updateModLevels();
  const carrier = C().engine.nodes.carrierGain.gain.value;
  const noise = C().engine.nodes.noiseBlendGain.gain.value;
  if (!approx(carrier, 0.15, 0.01) || !approx(noise, 0.1, 0.01)) throw new Error('carrier=' + carrier + ' noise=' + noise);
}},
{ group: 'Motor de audio · params', name: 'noise filter is bandpass around carrier', fn: () => {
  const filter = C().engine.nodes.noiseFilterL;
  if (filter.type !== 'bandpass' || !approx(filter.Q.value, 2, 0.01)) throw new Error('filter=' + filter.type + ' Q=' + filter.Q.value);
}},
{ group: 'Motor de audio · params', name: 'f-mod updates noise filter depth', fn: () => {
  setMods({ carrier: 400, fmod: 50 });
  C().engine.updateCarrier(400);
  C().engine.updateModLevels();
  const depth = C().engine.nodes.noiseFilterDepth.gain.value;
  if (!(depth > 0)) throw new Error('depth=' + depth);
}}, 
{ group: 'Motor de audio · params', name: 'mix=100 → masterGain ≈ 0.5', fn: () => {
  setMods({ mix: 100 });
  C().engine.updateModLevels();
  const g = C().engine.nodes.masterGain.gain.value;
  if (!approx(g, 0.5, 0.01)) throw new Error('esperado 0.5, obtenido ' + g);
}},

/* ── PRESETS ── */
{ group: 'Presets', name: 'applyPreset(delta, 2) aplica brainwave=2', fn: () => {
  C().applyPreset('delta', 2);
  if (C().state.brainwave !== 2) throw new Error('brainwave=' + C().state.brainwave);
}},
{ group: 'Presets', name: 'applyPreset(delta, 2) aplica defaults (amod=30)', fn: () => {
  C().applyPreset('delta', 2);
  if (C().state.amod !== 30) throw new Error('amod=' + C().state.amod);
}},
{ group: 'Presets', name: 'applyPreset(alpha, 10) aplica stereo=15', fn: () => {
  C().applyPreset('alpha', 10);
  if (C().state.stereo !== 15) throw new Error('stereo=' + C().state.stereo);
}},
{ group: 'Presets', name: 'applyPreset(gamma, 40) aplica fmod=10', fn: () => {
  C().applyPreset('gamma', 40);
  if (C().state.fmod !== 10) throw new Error('fmod=' + C().state.fmod);
}},
{ group: 'Presets', name: 'Los 5 presets corren sin lanzar', fn: () => {
  ['delta','theta','alpha','beta','gamma'].forEach((b, i) => {
    C().applyPreset(b, [2, 6, 10, 20, 40][i]);
  });
}},

/* ── VISUAL DEL CEREBRO ── */
{ group: 'Cerebro · regiones', name: 'brainwave=2 → deep activa', fn: () => {
  setMods({ brainwave: 2 }); C().updateBrain();
  const active = $$('.region.active').map(e => e.dataset.region);
  if (!active.includes('deep')) throw new Error('activas: ' + active.join(','));
}},
{ group: 'Cerebro · regiones', name: 'brainwave=6 → temporal + deep activas', fn: () => {
  setMods({ brainwave: 6 }); C().updateBrain();
  const active = $$('.region.active').map(e => e.dataset.region);
  if (!active.includes('temporal') || !active.includes('deep'))
    throw new Error('activas: ' + active.join(','));
}},
{ group: 'Cerebro · regiones', name: 'brainwave=10 → parietal + occipital activas', fn: () => {
  setMods({ brainwave: 10 }); C().updateBrain();
  const active = $$('.region.active').map(e => e.dataset.region);
  if (!active.includes('parietal') || !active.includes('occipital'))
    throw new Error('activas: ' + active.join(','));
}},
{ group: 'Cerebro · regiones', name: 'brainwave=20 → frontal activa', fn: () => {
  setMods({ brainwave: 20 }); C().updateBrain();
  const active = $$('.region.active').map(e => e.dataset.region);
  if (!active.includes('frontal')) throw new Error('activas: ' + active.join(','));
}},
{ group: 'Cerebro · regiones', name: 'brainwave=40 → frontal + parietal + occipital', fn: () => {
  setMods({ brainwave: 40 }); C().updateBrain();
  const active = $$('.region.active').map(e => e.dataset.region);
  const req = ['frontal','parietal','occipital'];
  const miss = req.filter(r => !active.includes(r));
  if (miss.length) throw new Error('faltan: ' + miss.join(','));
}},
{ group: 'Cerebro · regiones', name: 'Cambiar brainwave limpia las regiones anteriores', fn: () => {
  setMods({ brainwave: 2 }); C().updateBrain();
  setMods({ brainwave: 20 }); C().updateBrain();
  const active = $$('.region.active').map(e => e.dataset.region);
  if (active.includes('deep')) throw new Error('deep persistió tras cambiar a beta');
}},
{ group: 'Cerebro · regiones', name: 'Band info se actualiza (bandName, range, desc)', fn: () => {
  setMods({ brainwave: 10 }); C().updateBrain();
  const name = $('#bandName').textContent;
  if (name !== 'Alpha') throw new Error('esperado Alpha, obtenido ' + name);

/* ── RADAR — ANTI-REGRESIÓN (bug del usuario) ── */
{ group: 'Radar · anti-regresión', name: 'stereo=80 dibuja banda horizontal (radioX > radioY)', spec: 'radar/stereo', fn: () => {
  setMods({ stereo: 80, playing: true });
  resetDrawLog();
  C().drawRadarFrame();
  const ell = callsOf(radarCtx(), 'ellipse');
  const horizontal = ell.find(c => c[3] > c[4] + 10); // radiusX > radiusY
  if (!horizontal) throw new Error('no se dibujó banda horizontal (rx>ry)');
}},
{ group: 'Radar · anti-regresión', name: 'fmod=80 dibuja banda vertical (radioX << radioY)', spec: 'radar/fmod', fn: () => {
  setMods({ fmod: 80, playing: true });
  resetDrawLog();
  C().drawRadarFrame();
  const ell = callsOf(radarCtx(), 'ellipse');
  // buscar una elipse que no sea el contorno de la cabeza: su radiusY debe ser ≈ headRy
  // y su radiusX mucho menor. En la práctica: buscar ellipse con rx < ry * 0.5
  const vertical = ell.find(c => c[3] < c[4] * 0.55 && c[4] > 100);
  if (!vertical) throw new Error('no se dibujó banda vertical angosta');
}},
{ group: 'Radar · anti-regresión', name: 'binaural=80 dibuja 2 lóbulos en oídos', spec: 'radar/binaural', fn: () => {
  setMods({ binaural: 80, playing: true });
  resetDrawLog();
  C().drawRadarFrame();
  const ell = callsOf(radarCtx(), 'ellipse');
  // Excluir cabeza/anillos: los lóbulos son pequeños y están separados del centro.
  const lobes = ell.filter(c => Math.abs(c[2] - 160) < 5 && Math.abs(c[1] - 160) > 35 && c[3] > 15 && c[3] < 60);
  if (lobes.length !== 2) throw new Error('esperados 2 lóbulos, obtenidos ' + lobes.length);
  if (Math.abs((lobes[0][1] + lobes[1][1]) - 320) > 1)
    throw new Error('lóbulos no simétricos');
}},
{ group: 'Radar · anti-regresión', name: 'noise=80 dibuja ≥8 arcos difusos', spec: 'radar/noise', fn: () => {
  setMods({ noise: 80, playing: true });
  resetDrawLog();
  C().drawRadarFrame();
  const arcs = callsOf(radarCtx(), 'arc');
  if (arcs.length < 8) throw new Error('solo ' + arcs.length + ' arcos');
}},
{ group: 'Radar · anti-regresión', name: 'amod=80 dibuja anillo pulsante', spec: 'radar/amod', fn: () => {
  setMods({ amod: 80, playing: true });
  resetDrawLog();
  C().drawRadarFrame();
  const ell = callsOf(radarCtx(), 'ellipse');
  // el anillo de a-mod tiene rx/ry menores al outline pero mayores a los rings
  const ring = ell.find(c => c[3] > 80 && c[3] < 130 && Math.abs(c[3]/c[4] - 0.74/0.92) < 0.1);
  if (!ring) throw new Error('no se dibujó anillo de a-mod');
}},
{ group: 'Radar · anti-regresión', name: 'Sin moduladores → solo dibujo base (cabeza + 3 rings + ejes)', spec: 'radar/base', fn: () => {
  setMods({ stereo: 0, fmod: 0, binaural: 0, amod: 0, noise: 0 });
  resetDrawLog();
  C().drawRadarFrame();
  const ell = callsOf(radarCtx(), 'ellipse');
  // 3 rings + 1 cabeza = 4 elipses base
  if (ell.length > 6) throw new Error('demasiadas elipses en estado base: ' + ell.length);
}},
{ group: 'Radar · anti-regresión', name: 'detenido no dibuja campos dinámicos', spec: 'radar/stopped', fn: () => {
  setMods({ stereo: 80, fmod: 80, binaural: 80, amod: 80, noise: 80, playing: false });
  resetDrawLog();
  C().drawRadarFrame();
  const ell = callsOf(radarCtx(), 'ellipse');
  const arcs = callsOf(radarCtx(), 'arc');
  // Solo quedan 3 anillos + contorno; el marcador centrado puede seguir dibujándose.
  if (ell.length !== 6) throw new Error('se dibujaron campos detenidos: ' + ell.length + ' elipses');
  if (arcs.length > 3) throw new Error('se dibujó nube dinámica detenida: ' + arcs.length + ' arcos');
}},
{ group: 'Radar · anti-regresión', name: 'Cambiar stereo DEBE cambiar el dibujo (bug original)', spec: 'radar/stereo', fn: () => {
  setMods({ stereo: 0, playing: true });
  resetDrawLog();
  C().drawRadarFrame();

  setMods({ stereo: 80, playing: true });
  resetDrawLog();

/* ── RADAR — PUNTO FUENTE ── */
{ group: 'Radar · punto fuente', name: 'playing=false → punto en centro exacto', spec: 'radar/stopped', fn: () => {
  setMods({ playing: false, stereo: 80, fmod: 80 });
  resetDrawLog();
  C().drawRadarFrame();
  const arcs = callsOf(radarCtx(), 'arc');
  // el punto fuente es un arc con radio 4. Su centro debe ser (160, 160)
  const dot = arcs.find(c => c[3] === 4);
  if (!dot) throw new Error('no se encontró el punto fuente');
  if (dot[1] !== 160 || dot[2] !== 160)
    throw new Error('punto en (' + dot[1] + ',' + dot[2] + '), esperado (160,160)');
}},
{ group: 'Radar · punto fuente', name: 'playing=true + stereo=80 → punto se mueve en X', spec: 'radar/stereo', fn: async () => {
  setMods({ playing: true, stereo: 80, brainwave: 10 });
  // 3 muestras con delay para garantizar que la fase cambie
  const xs = [];
  for (let i = 0; i < 3; i++) {
    resetDrawLog();
    C().drawRadarFrame();
    const dot = callsOf(radarCtx(), 'arc').find(c => c[3] === 4);
    if (dot) xs.push(dot[1]);
    await wait(60);
  }
  const allCenter = xs.every(x => Math.abs(x - 160) < 0.5);
  if (allCenter) throw new Error('el punto nunca se movió de X=160');
}},
{ group: 'Radar · punto fuente', name: 'playing=true + fmod=80 → punto se mueve en Y', spec: 'radar/fmod', fn: async () => {
  setMods({ playing: true, fmod: 80, brainwave: 10 });
  const ys = [];
  for (let i = 0; i < 3; i++) {
    resetDrawLog();
    C().drawRadarFrame();
    const dot = callsOf(radarCtx(), 'arc').find(c => c[3] === 4);
    if (dot) ys.push(dot[2]);
    await wait(60);
  }
  const allCenter = ys.every(y => Math.abs(y - 160) < 0.5);
  if (allCenter) throw new Error('el punto nunca se movió de Y=160');
}},
{ group: 'Radar · punto fuente', name: 'playing=false → punto gris (no ámbar)', spec: 'radar/stopped', fn: () => {
  setMods({ playing: false });
  resetDrawLog();
  C().drawRadarFrame();
  // el último arc con radio 4 es el punto fuente
  const arcs = callsOf(radarCtx(), 'arc');
  const dot = arcs.find(c => c[3] === 4);
  if (!dot) throw new Error('no se encontró el punto');
  // El fillStyle se registra en la llamada a fill() que sigue
  const fillCalls = callsOf(radarCtx(), 'fill');
  // Validación blanda: al menos llamó fill() después de dibujar el punto
  if (fillCalls.length === 0) throw new Error('sin fill() tras el punto');
}},

/* ── TRANSICIONES DEL TIMELINE (spec timeline-transitions) ── */
{ group: 'Timeline · transiciones', name: 'interpolateAudioState: 0 = origen, 1 = destino, 0.5 = media', fn: () => {
  const C = frameWin.__CORTEX__;
  const a = { brainwave:2, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 };
  const z = { brainwave:40, carrier:400, amod:50, binaural:50, stereo:0, fmod:0, noise:0, mix:40 };
  const p0 = C.interpolateAudioState(a, z, 0);
  const p1 = C.interpolateAudioState(a, z, 1);
  const ph = C.interpolateAudioState(a, z, 0.5);
  if (p0.brainwave !== 2 || p0.carrier !== 200 || p0.mix !== 80) throw new Error('progreso 0 ≠ origen');
  if (p1.brainwave !== 40 || p1.carrier !== 400 || p1.mix !== 40) throw new Error('progreso 1 ≠ destino');
  if (Math.abs(ph.brainwave - 21) > 1e-9 || Math.abs(ph.carrier - 300) > 1e-9 || Math.abs(ph.mix - 60) > 1e-9)
    throw new Error('progreso 0.5 ≠ media');
}},
{ group: 'Timeline · transiciones', name: 'interpolateAudioState recorta el progreso fuera de rango', fn: () => {
  const C = frameWin.__CORTEX__;
  const a = { brainwave:2, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 };
  const z = { brainwave:40, carrier:400, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:40 };
  if (C.interpolateAudioState(a, z, 7).brainwave !== 40) throw new Error('progreso 7 no recorta a 1');
  if (C.interpolateAudioState(a, z, -3).brainwave !== 2) throw new Error('progreso -3 no recorta a 0');
}},
{ group: 'Timeline · transiciones', name: 'unidades: 2 min → 120 s y 90 s → 1.5 min', fn: () => {
  const C = frameWin.__CORTEX__;
  if (C.durationToSeconds('2', 'min', 'step') !== 120) throw new Error('2 min ≠ 120 s');
  if (C.secondsToDuration(90, 'min') !== '1.5') throw new Error('90 s ≠ 1.5 min');
  if (C.durationToSeconds('0.001', 'min', 'step') !== 1) throw new Error('paso bajo el mínimo no recorta a 1');
  if (C.clampTransitionSeconds(500) !== 60) throw new Error('transición sobre 60 no recorta');
  if (C.clampTransitionSeconds(0.5) !== 0.5) throw new Error('transición 0.5 válida');
}},
{ group: 'Timeline · transiciones', name: 'hint de duración muestra el equivalente en la otra unidad', fn: () => {
  const C = frameWin.__CORTEX__;
  const hintMin = C.durationHint(4, 'min');

  if (!hintMin.includes('4 s')) throw new Error('hint en min: ' + hintMin);
  if (!hintS.includes('2 min')) throw new Error('hint en s: ' + hintS);
}},
{ group: 'Timeline · transiciones', name: 'transición por omisión: 2 s activada; legacy sin campos', fn: () => {
  const C = frameWin.__CORTEX__;
  frameWin.localStorage.setItem('cortex-timeline-v1', JSON.stringify({

  }));

  if (C.timelineState.durationUnits.step !== 's') throw new Error('legacy no usa segundos');
  if (C.timelineState.steps.length !== 1) throw new Error('legacy perdió el paso');
}},
{ group: 'Timeline · transiciones', name: 'transición desactivada aplica el preset directo', fn: async () => {
  const C = frameWin.__CORTEX__;

    { id:'s1', presetId:'b', durationSeconds:2, snapshot:{ brainwave:2, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 }, name:'D', emoji:'d', band:'delta' }
  ];
  C.timelineState.loop = false;
  C.timelineState.transition.enabled = false;
  setMods({ brainwave: 10 });
  const p = C.getTimelinePlayer();
  p.play();
  await wait(150);

  p.stop();
}},
{ group: 'Timeline · transiciones', name: 'rampa: el progreso sale del reloj de audio (tiempo simulado en mock)', fn: () => {
  // El mock de esta página congela ctx.currentTime en 0, así que la rampa se
  // prueba anclando su inicio hacia atrás: 1 s de una rampa de 2 s = progreso
  // 0.5. El timing real con reloj vivo lo cubre tests/timeline-transitions.cjs.
  const C = frameWin.__CORTEX__;
  C.timelineState.steps = [
    { id:'s1', presetId:'b', durationSeconds:3, snapshot:{ brainwave:2, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 }, name:'D', emoji:'d', band:'delta' }
  ];
  C.timelineState.loop = false;
  C.timelineState.transition.enabled = true;
  C.timelineState.transition.seconds = 2;
  setMods({ brainwave: 10 });
  const p = C.getTimelinePlayer();
  p.play();
  p.transitionStartedAt = p.clockNow() - 1;   // 1 s consumido de 2 s
  p.applyTransitionProgress();
  const mid = C.state.brainwave;
  if (mid <= 2.2 || mid >= 9.8) throw new Error('sin estado intermedio: ' + mid);
  p.transitionStartedAt = p.clockNow() - 2;   // rampa vencida
  p.applyTransitionProgress();
  if (Math.abs(C.state.brainwave - 2) > 0.05) throw new Error('no converge a 2 Hz: ' + C.state.brainwave);
  if (p.transitionDone !== true) throw new Error('la rampa no quedó marcada como terminada');
  p.stop();
}},

{ group: 'Timeline · dock', name: 'selección por click: un clip resaltado y el inspector con sus datos', fn: async () => {
  const C = frameWin.__CORTEX__;
  C.timelineState.steps = [
    { id:'d1', presetId:'b', durationSeconds:10, snapshot:{ brainwave:2, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 }, name:'Delta', emoji:'d', band:'delta' },
    { id:'t1', presetId:'b', durationSeconds:20, snapshot:{ brainwave:6, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 }, name:'Theta', emoji:'t', band:'theta' },
    { id:'a1', presetId:'b', durationSeconds:30, snapshot:{ brainwave:10, carrier:200, amod:0, binaural:0, stereo:0, fmod:0, noise:0, mix:80 }, name:'Alpha', emoji:'a', band:'alpha' },
  ];
  C.renderTimeline();
  $$('.dock-clip-btn')[0].click();
  await nextFrame();
  if ($$('.dock-clip.selected').length !== 1) throw new Error('no quedó exactamente un clip seleccionado');
  const inspector = frameDoc.getElementById('dockInspector');
  if (inspector.hidden) throw new Error('el inspector no se abrió');
  if (!frameDoc.getElementById('inspectorName').textContent.includes('Delta')) throw new Error('el inspector no muestra el nombre');
  if (frameDoc.getElementById('inspectorDuration').value !== '10') throw new Error('la duración no se ve en segundos: ' + frameDoc.getElementById('inspectorDuration').value);
}},
{ group: 'Timeline · dock', name: 'proporcionalidad: 10/20/30 s se ven como 1:2:3 con piso legible', fn: async () => {
  if (!C().state.dockExpanded) frameDoc.getElementById('btnOpenTimeline').click();
  await nextFrame();
  const widths = $$('.dock-clip').map(el => el.offsetWidth);
  if (widths.length !== 3) throw new Error('esperaba 3 clips, hay ' + widths.length);
  if (!(widths[2] > widths[1] && widths[1] > widths[0])) throw new Error('sin orden 10<20<30: ' + widths.join(','));
  const ratio = widths[2] / widths[0];
  if (Math.abs(ratio - 3) > 0.6) throw new Error('proporción 30/10 lejana de 3: ' + ratio.toFixed(2));
  if (widths[0] < 44) throw new Error('clip por debajo del ancho mínimo: ' + widths[0]);
  const chips = $$('.dock-clip .dock-clip-chip').map(el => el.textContent.trim());
  if (chips.join('|') !== '10 s|20 s|30 s') throw new Error('chips: ' + chips.join('|'));
}},
{ group: 'Timeline · dock', name: 'doble click aplica el preset del clip', fn: () => {
  $$('.dock-clip-btn')[0].dispatchEvent(new frameWin.MouseEvent('dblclick', { bubbles: true }));
  if (C().state.brainwave !== 2) throw new Error('el doble click no aplicó el snapshot (delta = 2 Hz): ' + C().state.brainwave);
}},
{ group: 'Timeline · dock', name: 'editar la duración en el inspector actualiza y persiste', fn: async () => {
  $$('.dock-clip-btn')[0].click();
  await nextFrame();
  const input = frameDoc.getElementById('inspectorDuration');
  input.value = '90';
  input.dispatchEvent(new frameWin.Event('change', { bubbles: true }));
  await nextFrame();
  if (C().timelineState.steps[0].durationSeconds !== 90) throw new Error('la duración guardada no es 90 s');
  const chip = $$('.dock-clip .dock-clip-chip')[0].textContent.trim();
  if (chip !== '90 s') throw new Error('el chip no se actualizó: ' + chip);
}},

];

/* ═══════════════════════════════════════════════════════════════
   5. RUNNER
   ═══════════════════════════════════════════════════════════════ */
async function runAllTests() {
  const btn = document.getElementById('btnRun');
  btn.disabled = true;
  document.getElementById('report').innerHTML = '';
  const t0 = performance.now();

  const groups = new Map();
  for (const t of TESTS) {
    if (!groups.has(t.group)) groups.set(t.group, []);
    groups.get(t.group).push(t);
  }

  let pass = 0, fail = 0;

  for (const [groupName, tests] of groups) {
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `<span>${groupName}</span><span class="counts"></span>`;
    groupEl.appendChild(head);

    let gp = 0, gf = 0;

    for (const t of tests) {
      const testEl = document.createElement('div');
      testEl.className = 'test';
      const specTag = t.spec ? `<span class="spec">[${t.spec}]</span>` : '';
      try {
        await t.fn();
        testEl.classList.add('pass');
        testEl.innerHTML = `${t.name} ${specTag}`;
        gp++; pass++;
      } catch (e) {
        testEl.classList.add('fail');
        testEl.innerHTML = `${t.name} ${specTag}<div class="msg">${e.message || e}</div>`;
        gf++; fail++;
      }
      groupEl.appendChild(testEl);
    }

    head.querySelector('.counts').innerHTML =
      `<span class="pass">${gp}✓</span>${gf ? ` <span class="fail">${gf}✗</span>` : ''}`;
    document.getElementById('report').appendChild(groupEl);
  }

  const elapsed = (performance.now() - t0).toFixed(0);
  const summary = document.createElement('div');
  summary.className = 'summary ' + (fail === 0 ? 'pass' : 'fail');
  summary.innerHTML = `
    <strong>${pass + fail} tests ejecutados en ${elapsed}ms</strong><br>
    ${pass}✓ pasaron · ${fail}✗ fallaron<br>
    <span style="color:#6B6358;font-size:11px">
      ${fail === 0 ? 'Todos los escenarios OpenSpec verificados.' : 'Revisar los tests marcados en rojo.'}
    </span>
  `;
  document.getElementById('report').appendChild(summary);

  btn.disabled = false;
}
